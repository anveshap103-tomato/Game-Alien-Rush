<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alien Rushh</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }
        
        #gameCanvas {
            border: 2px solid #00ffff;
            background: linear-gradient(180deg, #001122 0%, #000033 100%);
            box-shadow: 0 0 20px #00ffff;
            max-width: 100vw;
            max-height: 100vh;
        }
        
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #00ffff;
            font-size: clamp(14px, 2.5vw, 18px);
            z-index: 10;
        }
        
        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff0066;
            text-align: center;
            font-size: clamp(18px, 4vw, 24px);
            display: none;
            z-index: 20;
        }
        
        button {
            background: #00ffff;
            color: #000;
            border: none;
            padding: clamp(8px, 2vw, 10px) clamp(16px, 4vw, 20px);
            font-size: clamp(14px, 3vw, 16px);
            cursor: pointer;
            margin-top: 10px;
        }
        
        @media (max-width: 768px) {
            body {
                padding: 5px;
            }
            #ui {
                top: 5px;
                left: 5px;
            }
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div id="ui">
        <div>Alien Pack: <span id="swarmSize">3</span></div>
        <div>Score: <span id="score">0</span></div>
        <div>Crystals: <span id="crystals">0</span></div>
    </div>
    <div id="gameOver">
        <h2>ALIENS ELIMINATED!</h2>
        <p>Final Score: <span id="finalScore">0</span></p>
        <button onclick="game.restart()">RESTART MISSION</button>
    </div>
    
    <script src="game.js"></script>
</body>
</html>
